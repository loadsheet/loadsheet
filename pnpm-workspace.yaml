packages:
  - "packages/*"
  - "apps/*"

catalogMode: prefer

catalog:
  "@types/node": ^26.6.6
  "@ui-sdk/core": 0.1.0-beta.17
  "@ui-sdk/vue": 0.1.0-beta.17
  "@valibot/to-json-schema": ^1.8.0
  "@vite-hub/kit": 0.6.1
  # A preview build; drop blockExoticSubdeps below once @vite-hub/schedule/os is on npm.
  "@vite-hub/schedule": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/schedule@6b1390a
  ajv: ^8.20.0
  ajv-formats: ^3.0.1
  cron-schedule: ^6.0.0
  fastest-levenshtein: 1.0.16
  jsonc-parser: 3.3.1
  miniflare: 5.20261123.1-beta
  publint: ^0.3.25
  skills: ^1.9.0
  smol-toml: 1.9.1
  tar: ^7.5.22
  tsdown: ^0.23.7
  tinyaml: ^0.1.2
  tsrs: 0.20.1-ts7.1.0-beta
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite-plus: ^1.4.0

# The @vite-hub/schedule preview depends on the @vite-hub/runtime preview by pkg.pr.new URL, an "exotic"
# subdependency. Drop this once @vite-hub/schedule/os is published to npm.
blockExoticSubdeps: false
allowBuilds:
  esbuild: false
  # wrangler dev runs the built Worker in workerd, which downloads its binary in an install script.
  workerd: true
  vue-demi: false

minimumReleaseAgeExclude:
  - "@ui-sdk/core@0.1.0-beta.17"
  - "@ui-sdk/vue@0.1.0-beta.17"
  - "@vite-hub/kit@0.6.1"
  - "@nuxt/kit-nightly@5.0.0-2611251439-b19192b"
  - "@nuxt/nitro-server-nightly@5.0.0-2611251439-b19192b"
  - "@nuxt/schema-nightly@5.0.0-2611251439-b19192b"
  - "@nuxt/vite-builder-nightly@5.0.0-2611251439-b19192b"
  - "@nuxt/vite-server-nightly@5.0.0-2611251439-b19192b"
  - "@vite-hub/auth@0.6.1"
  - "@vite-hub/blob@0.6.1"
  - "@vite-hub/bundle@0.6.1"
  - "@vite-hub/cms@0.6.1"
  - "drizzle-kit@1.0.0-rc.6"
  - "@vite-hub/cli@0.6.1"
  - "@vite-hub/comments@0.6.1"
  - "@vite-hub/content@0.6.1"
  - "@vite-hub/database@0.6.1"
  - "@vite-hub/docs@0.6.1"
  - "@vite-hub/env@0.6.1"
  - "@vite-hub/forge@0.6.1"
  - "@vite-hub/markdown-template@0.6.1"
  - "@vite-hub/rate-limit@0.6.1"
  - "@vite-hub/realtime@0.6.1"
  - "@vite-hub/runtime@0.6.1"
  - "@vite-hub/sandbox@0.6.1"
  - "@vite-hub/source@0.6.1"
  - "@vite-hub/ui@0.6.1"
  - "@vite-hub/web-container@0.6.1"
  - "@vite-hub/workspace@0.6.1"
  - nuxt-nightly@5.0.0-2611251439-b19192b
  - vite-hub@0.6.1
