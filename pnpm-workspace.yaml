packages:
  - "packages/*"
  - "apps/*"

catalogMode: prefer

catalog:
  "@types/node": ^26.6.6
  "@ui-sdk/core": 0.1.0-beta.17
  "@ui-sdk/vue": 0.1.0-beta.17
  "@valibot/to-json-schema": ^1.8.0
  "@vite-hub/kit": 0.5.0
  # A preview build; drop blockExoticSubdeps below once @vite-hub/schedule/os is on npm.
  "@vite-hub/schedule": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/schedule@6b1390a
  ajv: ^8.20.0
  ajv-formats: ^3.0.1
  cron-schedule: ^6.0.0
  fastest-levenshtein: 1.0.16
  jsonc-parser: 3.3.1
  publint: ^0.3.25
  skills: ^1.9.0
  smol-toml: 1.9.1
  tar: ^7.5.22
  tsdown: ^0.23.7
  tinyaml: ^0.1.2
  tsrs: 0.20.1-ts7.1.0-beta
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite-plus: ^1.4.0

# The @vite-hub/schedule preview depends on the @vite-hub/runtime preview by pkg.pr.new URL, an "exotic"
# subdependency. Drop this once @vite-hub/schedule/os is published to npm.
blockExoticSubdeps: false
allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - "@ui-sdk/core@0.1.0-beta.17"
  - "@ui-sdk/vue@0.1.0-beta.17"
  - "@vite-hub/kit@0.5.0"
